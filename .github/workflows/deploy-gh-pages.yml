name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Ensure Linux native optional deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "require.resolve('@rollup/rollup-linux-x64-gnu'); require.resolve('lightningcss-linux-x64-gnu')"; then
            echo "Optional native modules missing; installing fallback packages"
            npm i --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu
          fi

      - name: Build
        env:
          VITE_AI_ENDPOINT: ${{ secrets.VITE_AI_ENDPOINT }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
